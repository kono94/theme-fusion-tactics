#cloud-config

# =============================================================================
# TFT Server Bootstrap (Hetzner VPS)
# =============================================================================
# 1. Paste this in Hetzner Cloud Console → Create Server → Cloud config
# 2. Replace <YOUR_ADMIN_SSH_KEY> and <YOUR_GITHUB_ACTION_SSH_KEY>
# 3. After boot, SSH in and run: bash /opt/tft/deployment/initial-setup.sh
# =============================================================================

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - gettext-base
  - ufw
  - fail2ban

users:
  # Admin user (you)
  - name: deployer
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "<YOUR_ADMIN_SSH_KEY>"

  # GitHub Actions deploy user (restricted)
  - name: github-deployer
    groups: docker
    shell: /bin/bash
    ssh_authorized_keys:
      - "<YOUR_GITHUB_ACTION_SSH_KEY>"

swap:
  filename: /swap.img
  size: 2G
  maxsize: 2G

write_files:
  # SSH Hardening
  - path: /etc/ssh/sshd_config.d/hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      Port 2222
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 2
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers deployer github-deployer

  # Restrict github-deployer to deploy script only
  - path: /etc/ssh/sshd_config.d/github-deploy.conf
    content: |
      Match User github-deployer
          ForceCommand /usr/local/bin/deploy-trigger

  # GitOps Deploy Trigger
  - path: /usr/local/bin/deploy-trigger
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      set -e
      PROJECT_DIR="/opt/tft"
      LOCK_FILE="/tmp/tft-deploy.lock"

      echo "[$(date)] GitOps Deploy Triggered"

      exec 9>"$LOCK_FILE"
      if ! flock -n 9; then
        echo "Another deployment is already running."
        exit 1
      fi
      
      cd "$PROJECT_DIR"

      if [ ! -w ".git/objects" ]; then
        echo "Repository is not writable by $(whoami)."
        echo "Repair with: sudo chown -R github-deployer:github-deployer $PROJECT_DIR/.git"
        exit 1
      fi

      git fetch --all --tags --force

      REQUESTED_TAG=""
      if [[ "${SSH_ORIGINAL_COMMAND:-}" =~ ^trigger-deploy[[:space:]]+([A-Za-z0-9._/-]+)$ ]]; then
        REQUESTED_TAG="${BASH_REMATCH[1]}"
      fi
      
      if [ -n "$REQUESTED_TAG" ] && git rev-parse -q --verify "refs/tags/$REQUESTED_TAG^{commit}" >/dev/null; then
        DEPLOY_REF="tags/$REQUESTED_TAG"
      else
        DEPLOY_REF=$(git describe --tags --abbrev=0 origin/main 2>/dev/null || echo "origin/main")
      fi

      echo "Deploying: $DEPLOY_REF"
      git -c advice.detachedHead=false checkout -f "$DEPLOY_REF"

      bash "$PROJECT_DIR/deployment/deploy.sh"

runcmd:
  # Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Fail2ban
  - printf "[sshd]\nenabled = true\nport = ssh, 2222\nbanaction = iptables-multiport" > /etc/fail2ban/jail.local
  - systemctl enable fail2ban

  # Firewall
  - ufw allow 2222
  - ufw allow 80
  - ufw allow 443
  - ufw --force enable

  # Clone repository
  - git clone https://github.com/kono94/theme-fusion-tactics.git /opt/tft
  - chown -R github-deployer:github-deployer /opt/tft

  # Reboot to apply SSH changes
  - reboot

final_message: |
  ========================================
  TFT Server Ready!
  SSH: ssh -p 2222 deployer@<IP> -i ~/.ssh/your_key
  Then: bash /opt/tft/deployment/initial-setup.sh
  ========================================
