name: Deploy
on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: github-deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "trigger-deploy ${{ github.ref_name }}" # ForceCommand runs deploy-trigger; the requested tag is available via SSH_ORIGINAL_COMMAND
