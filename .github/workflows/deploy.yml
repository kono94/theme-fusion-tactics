name: Deploy
on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          port: 2222
          username: github-deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "trigger-deploy ${{ github.ref_name }}" # ForceCommand runs deploy-trigger; the requested tag is available via SSH_ORIGINAL_COMMAND
