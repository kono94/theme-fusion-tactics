name: Deploy
on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

env:
  TFT_RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  desktop-game:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            desktop/pom.xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python3 desktop/build.py --prepare-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-game
          path: desktop/target/prepared/
          if-no-files-found: error

  desktop:
    needs: desktop-game
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            python: python
          - os: macos-15
            platform: macos-arm64
            python: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            desktop/pom.xml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-game
          path: desktop/target/shared/
      - name: Make Windows installer tools available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WIX) {
            "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - run: ${{ matrix.python }} desktop/build.py --bundle desktop/target/shared
      - name: Upload verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/target/distribution/${{ matrix.platform }}/release/
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*-*
          path: distributions
      - name: Publish all verified desktop artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, os
          manifests = list(Path('distributions').glob('*/tft-update.json'))
          assert len(manifests) == 2, 'Missing platform distribution'
          reference = json.loads(manifests[0].read_text())
          game = reference['jarAsset']
          for manifest in manifests:
              current = json.loads(manifest.read_text())
              assert current == reference, 'Platform game manifests differ'
              assert hashlib.sha256((manifest.parent / game).read_bytes()).hexdigest() == reference['sha256']
          output = Path('release')
          output.mkdir()
          shutil.copy2(manifests[0], output / 'tft-update.json')
          shutil.copy2(manifests[0].parent / game, output / game)
          for key, filename in reference['installerAssets'].items():
              shutil.copy2(Path('distributions') / ('desktop-' + key) / filename, output / filename)
          Path('release-notes.md').write_text('Standalone preview for Windows and macOS. Download the installer for your platform; Java is included. Unsigned macOS previews require allowing the app in System Settings → Privacy & Security. See desktop/README.md in the repository for installation and configuration details.')
          PY
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > draft-state.txt; then
            if [[ "$(cat draft-state.txt)" != true ]]; then
              echo "Release is already published; keeping its immutable assets."
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --draft=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  deploy:
    needs: verify
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          port: 2222
          username: github-deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: "trigger-deploy ${{ github.ref_name }}" # ForceCommand runs deploy-trigger; the requested tag is available via SSH_ORIGINAL_COMMAND
