# TFT Docker Compose
# Dev:  docker compose --profile dev up
# Prod: docker compose --profile prod up -d

services:
  observability-init:
    image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: tft-observability-init
    command:
      - sh
      - -c
      - >-
        chown 10001:10001 /loki /otelcol &&
        chown -R 472:0 /analytics &&
        chmod 2770 /analytics &&
        find /analytics -type f -exec chmod 0660 {} +
    volumes:
      - loki-data:/loki
      - otel-collector-data:/otelcol
      - /var/lib/tft/analytics:/analytics

  otel-javaagent:
    image: otel/autoinstrumentation-java:2.31.0@sha256:13dc3ab07f7c77dad3dea30d8a154a09f041205f4e6d16dc28429874c32815bc
    container_name: tft-otel-javaagent
    command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
    volumes:
      - otel-javaagent:/otel

  backend:
    build:
      context: ./backend
      args:
        APP_GIT_TAG: ${APP_GIT_TAG:-dev}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: tft-backend
    entrypoint: ["sh", "-c", "umask 0002 && exec java --enable-preview -jar app.jar"]
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - ANALYTICS_ADMIN_PASSWORD=${ANALYTICS_ADMIN_PASSWORD:-}
      - WEBSOCKET_ALLOWED_ORIGIN_PATTERNS=${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      - APP_GIT_TAG=${APP_GIT_TAG:-dev}
      - APP_GIT_COMMIT=${APP_GIT_COMMIT:-unknown}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=theme-fusion-tactics-backend
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=${SPRING_PROFILES_ACTIVE:-dev},service.version=${APP_GIT_TAG:-dev}
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=http://otel-collector:4318/v1/logs
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_TRACES_EXPORTER=none
      - OTEL_TRACES_SAMPLER=always_off
      - OTEL_METRIC_EXPORT_INTERVAL=15000
      - OTEL_METRICS_EXEMPLAR_FILTER=always_off
    volumes:
      - /var/lib/tft/analytics:/app/data
      - otel-javaagent:/otel:ro
    depends_on:
      observability-init:
        condition: service_completed_successfully
      otel-javaagent:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tft-frontend
    expose:
      - "80"

  mimir:
    image: grafana/mimir:3.2.1@sha256:92838f113ba54230014e79bc812e57ca90bb9ebc06e665f59e4f700098c2dd04
    container_name: tft-mimir
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes:
      - ./deployment/observability/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data
    expose:
      - "9009"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    container_name: tft-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deployment/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/data
    depends_on:
      observability-init:
        condition: service_completed_successfully
    expose:
      - "3100"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    container_name: tft-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    volumes:
      - ./deployment/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel-collector-data:/var/lib/otelcol
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
    depends_on:
      observability-init:
        condition: service_completed_successfully
      mimir:
        condition: service_started
      loki:
        condition: service_started
    expose:
      - "4317"
      - "4318"
      - "8888"
      - "13133"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: tft-grafana
    environment:
      - GF_SERVER_DOMAIN=${DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-local-development-secret-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_PLUGINS_PREINSTALL_SYNC=frser-sqlite-datasource@4.0.6
    volumes:
      - grafana-data:/var/lib/grafana
      - /var/lib/tft/analytics:/var/lib/tft-analytics
      - ./deployment/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deployment/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      observability-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      mimir:
        condition: service_started
      loki:
        condition: service_started
    expose:
      - "3000"
    restart: unless-stopped

  # Development nginx (HTTP only) - default when no profile specified
  nginx:
    image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: tft-nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx/dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - grafana
    profiles:
      - dev

  # Production nginx (HTTPS)
  nginx-prod:
    image: nginx:alpine@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
    container_name: tft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certbot/conf:/etc/letsencrypt:ro
      - ./deployment/certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - grafana
    profiles:
      - prod

  # Certificate renewal (production only)
  certbot:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    container_name: tft-certbot
    volumes:
      - ./deployment/certbot/conf:/etc/letsencrypt
      - ./deployment/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - prod

volumes:
  grafana-data:
  loki-data:
  mimir-data:
  otel-collector-data:
  otel-javaagent:
